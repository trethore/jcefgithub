name: Publish

on:
  workflow_dispatch:
    inputs:
      build_meta:
        description: HTTPS URL of the jcefbuild build_meta.json
        required: true
      mvn_version:
        description: Maven/release version
        required: true
      publish_target:
        description: Publication destination
        required: true
        default: both
        type: choice
        options: [both, github, maven]

concurrency:
  group: publish-${{ inputs.mvn_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release artifacts
        run: ./generate_artifacts.sh "$BUILD_META" "$MVN_VERSION"
        env:
          BUILD_META: ${{ inputs.build_meta }}
          MVN_VERSION: ${{ inputs.mvn_version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-${{ inputs.mvn_version }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish-github:
    if: inputs.publish_target == 'both' || inputs.publish_target == 'github'
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {java-version: '17', distribution: temurin}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-${{ inputs.mvn_version }}
          path: out
      - name: Publish GitHub Packages
        run: ./packaging/scripts/upload_artifacts.sh "$BUILD_META" "$MVN_VERSION"
        env:
          BUILD_META: ${{ inputs.build_meta }}
          MVN_VERSION: ${{ inputs.mvn_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Generate release notes
        run: ./packaging/scripts/create_release_info.sh "$BUILD_META" "$RUN_URL" "$RUN_NUMBER" "$MVN_VERSION"
        env:
          BUILD_META: ${{ inputs.build_meta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          MVN_VERSION: ${{ inputs.mvn_version }}
      - name: Create release and upload artifacts
        run: |
          gh release create "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file release_info/release_message.md
          files=(out/*.jar release_info/build_meta.json)
          gh release upload "$RELEASE_TAG" "${files[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.mvn_version }}
          RELEASE_NAME: JCEF GitHub ${{ inputs.mvn_version }}

  publish-central:
    if: inputs.publish_target == 'both' || inputs.publish_target == 'maven'
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-${{ inputs.mvn_version }}
          path: out
      - name: Publish Maven Central
        run: ./packaging/scripts/upload_artifacts_maven.sh "$BUILD_META" "$MVN_VERSION"
        env:
          BUILD_META: ${{ inputs.build_meta }}
          MVN_VERSION: ${{ inputs.mvn_version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
