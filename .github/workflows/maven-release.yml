name: maven-release

on:
  workflow_call:
    inputs:
      build_meta:
        required: true
        type: string
      mvn_version:
        required: false
        type: string
        default: '1.0.0'
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        required: true
      MAVEN_GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      build_meta:
        description: 'Build meta to use as source'
        required: true
      mvn_version:
        description: 'Maven version to use'
        required: false
        default: '1.0.0'

jobs:
  maven-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_META: ${{ inputs.build_meta || github.event.inputs.build_meta }}
      MVN_VERSION: ${{ inputs.mvn_version || github.event.inputs.mvn_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create artifacts
        run: chmod +x generate_artifacts.sh && ./generate_artifacts.sh "$BUILD_META" "$MVN_VERSION"

      - name: Publish to Maven Central
        run: chmod +x upload_artifacts_maven.sh && ./upload_artifacts_maven.sh "$BUILD_META" "$MVN_VERSION"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
